<!DOCTYPE html>

<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">


<title>BookEase - Make a Booking</title>

<link rel="stylesheet" href="style.css">


</head>

<body>


<!-- Header -->
<header>

    <h1>BookEase</h1>

    <nav>
        <a href="index.html">Home</a>
        <a href="services.html">Services</a>
        <a href="index.html#about">About</a>
        <a href="index.html#contact">Contact</a>
    </nav>

</header>


<!-- Booking Section -->
<main>

    <section class="booking-section">

        <h2>Make a Booking</h2>

        <p>
            Complete the form below to request your appointment.
        </p>


        <form id="bookingForm">

            <!-- Name -->
            <div class="form-group">

                <label for="name">
                    Full Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your full name"
                    required
                >

            </div>


            <!-- Email -->
            <div class="form-group">

                <label for="email">
                    Email Address
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >

            </div>


            <!-- Phone -->
            <div class="form-group">

                <label for="phone">
                    Phone Number
                </label>

                <input
                    type="tel"
                    id="phone"
                    name="phone"
                    placeholder="Enter your phone number"
                    required
                >

            </div>


            <!-- Service -->
            <div class="form-group">

                <label for="service">
                    Select Service
                </label>

                <select
                    id="service"
                    name="service"
                    required
                >

                    <option value="">
                        -- Select a Service --
                    </option>

                    <option value="Hair Services">
                        Hair Services
                    </option>

                    <option value="Beauty Services">
                        Beauty Services
                    </option>

                    <option value="Cleaning Services">
                        Cleaning Services
                    </option>

                    <option value="IT Support">
                        IT Support
                    </option>

                </select>

            </div>


            <!-- Date -->
            <div class="form-group">

                <label for="date">
                    Preferred Date
                </label>

                <input
                    type="date"
                    id="date"
                    name="date"
                    required
                >

            </div>


            <!-- Time -->
            <div class="form-group">

                <label for="time">
                    Preferred Time
                </label>

                <input
                    type="time"
                    id="time"
                    name="time"
                    required
                >

            </div>


            <!-- Message -->
            <div class="form-group">

                <label for="message">
                    Additional Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="5"
                    placeholder="Tell us anything we should know..."
                ></textarea>

            </div>


            <!-- Submit -->
            <button type="submit">
                Submit Booking
            </button>

        </form>

    </section>

</main>


<!-- Footer -->
<footer>

    <p>
        &copy; 2026 BookEase. All rights reserved.
    </p>

</footer>


<script src="script.js"></script>


</body>

</html>
